# SOURCE: SigmaHQ sysmon_process_tampering.yml
# CONTEXT: Sysmon EID 25 fires when Sysmon detects process hollowing,
# process doppelganging, or process herpaderping. These are advanced
# injection techniques to make malware appear as a legitimate process.
# This event ONLY fires when actual tampering is detected - it is NOT
# generated by normal process creation. Any occurrence is critical.
# FALSE POSITIVE: None. This event is generated exclusively by Sysmon's
# own tampering detection heuristic.
title: Sysmon Process Tampering Detected (Hollowing/Doppelganging)
event_id: "25"
description: >
  Sysmon detected process tampering - process hollowing, doppelganging,
  or herpaderping. The malicious process replaces legitimate process memory
  to evade detection. Used by advanced malware to masquerade as system
  processes while executing attacker code. EID 25 is Sysmon's definitive
  anti-evasion signal - always critical when present.
severity: critical
confidence: 0.99
technique: T1055.012
mitre: Defense Evasion
conditions: []
