# SOURCE: SigmaHQ win_security_susp_lsass_dump_generic.yml
#         mdecrevoisier windows-lsass/LSASS process accessed by non system account
#         Elastic detection-rules LSASS memory dump EID 4656
# CONTEXT: This rule detects LSASS credential dumping using the SECURITY
# audit log (EID 4656/4663) rather than Sysmon EID 10. This is critical
# for environments WITHOUT Sysmon deployed - the Security log still
# captures LSASS handle requests with the same access masks.
# EID 4656 = handle to object requested; EID 4663 = access attempted.
# The ObjectName must end in \lsass.exe (the process object itself).
# FALSE POSITIVE EXCLUSIONS taken from SigmaHQ's maintained filter list.
# GamingServices, lsm, MicrosoftEdgeUpdate are confirmed FP sources.
title: LSASS Memory Access via Security Audit (No Sysmon Required)
event_id: "4656"
event_ids: ["4656", "4663"]
description: >
  A handle was requested (EID 4656) or access attempted (EID 4663) against
  the lsass.exe process object with access masks used by credential dumping
  tools. This works WITHOUT Sysmon by using Security audit object access.
  Requires 'Audit Object Access' policy and lsass.exe SACL configured.
  Access masks 0x1010, 0x1410, 0x1f0fff etc. are Mimikatz/NanoDump/ProcDump
  standard access patterns.
  Source: SigmaHQ win_security_susp_lsass_dump_generic.yml +
  mdecrevoisier windows-lsass rules.
severity: critical
confidence: 0.89
technique: T1003.001
mitre: Credential Access
conditions:
  - field: ObjectName
    ends_with_any:
      - "\\lsass.exe"
  - field: AccessMask
    contains_any:
      - "0x1010"
      - "0x1400"
      - "0x1410"
      - "0x1418"
      - "0x1438"
      - "0x143a"
      - "0x1f0fff"
      - "0x1f1fff"
      - "0x1f2fff"
      - "0x1f3fff"
      - "0x40"
      - "0x100000"
  - field: SubjectUserName
    not_ends_with: "$"
    not_empty: true
  - field: ProcessName
    not_ends_with_any:
      - "\\csrss.exe"
      - "\\GamingServices.exe"
      - "\\lsm.exe"
      - "\\MicrosoftEdgeUpdate.exe"
      - "\\werfault.exe"
      - "\\taskmgr.exe"
