# SOURCE: mdecrevoisier windows-os "Wdigest authentication enabled"
#         SigmaHQ win_security_wdigest_registry.yml
# CONTEXT: WDigest authentication stores plaintext credentials in LSASS.
# Modern Windows disables it by default (KB2871997). Attackers re-enable
# it to harvest plaintext creds from LSASS after the next user login.
# Registry key: HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
# Value: UseLogonCredential = 1 (enable) - default is 0 (disabled)
# EID 4657 (Security) = registry value modified
# Sysmon EID 13 = registry value set
# FALSE POSITIVE: None in production environments. WDigest should never
# be re-enabled. Any occurrence is attacker action.
title: WDigest Plaintext Credential Storage Re-Enabled
event_id: "4657"
event_ids: ["4657", "13"]
description: >
  The WDigest UseLogonCredential registry value was set to 1, re-enabling
  plaintext credential storage in LSASS memory. Modern Windows disables
  this by default. Attackers enable it to harvest plaintext credentials
  from LSASS after the next user login, even without Mimikatz access masks.
  Source: mdecrevoisier Wdigest re-enabled rule + SigmaHQ registry detection.
severity: critical
confidence: 0.97
technique: T1112
mitre: Defense Evasion
conditions:
  - field: ObjectName
    contains_any:
      - "WDigest"
      - "SecurityProviders\\WDigest"
  - field: NewValue
    contains_any:
      - "UseLogonCredential"
      - "1"
