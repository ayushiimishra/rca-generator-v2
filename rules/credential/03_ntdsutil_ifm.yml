# SOURCE: mdecrevoisier windows-active_directory IFM created rules
#         SigmaHQ proc_creation_win_ntdsutil_susp_usage.yml
# CONTEXT: ntdsutil with "ifm" and "create full" creates an Install From Media
# snapshot of the Active Directory database (NTDS.dit + SYSTEM hive).
# An attacker with this snapshot can extract ALL domain credentials offline.
# Legitimate IFM creation is a planned DC promotion activity - extremely rare.
# The command string "ac i ntds" (activate instance ntds) preceding IFM is
# the standard ntdsutil sequence for NTDS access.
# FALSE POSITIVE: Legitimate DC promotion from IFM. Should correlate with
# planned change management. Unplanned occurrence = almost certainly attacker.
title: ntdsutil IFM - Active Directory Database Dump
event_id: "4688"
event_ids: ["4688", "1"]
description: >
  ntdsutil.exe was used with IFM (Install From Media) parameters to create
  a full snapshot of the Active Directory database. An attacker with the
  resulting snapshot can extract all domain password hashes offline.
  This is used by attackers with Domain Admin access as an alternative to
  DCSync that generates different log artifacts.
  Legitimate use: planned DC promotion from IFM (extremely rare in production).
  Source: mdecrevoisier IFM created detection + SigmaHQ ntdsutil rules.
severity: critical
confidence: 0.96
technique: T1003.003
mitre: Credential Access
conditions:
  - field: Image
    ends_with_any:
      - "\\ntdsutil.exe"
  - field: CommandLine
    contains_any:
      - "ifm"
      - "create full"
      - "ac i ntds"
      - "snapshot"
