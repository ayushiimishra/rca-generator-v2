# SOURCE: SigmaHQ win_security_kerberoast_rc4_req.yml (burst extension)
#         mdecrevoisier kerberoasting rule with burst detection
#         hayabusa-rules value_count correlation pattern
# CONTEXT: The existing rule 16 detects individual RC4 TGS requests.
# BURST Kerberoasting (3+ RC4 requests in 60 seconds from same IP) is
# the automated tool signature - Rubeus, Impacket GetSPNs dump all
# service tickets at once. Single RC4 requests could be legacy compat.
# Burst = attacker running a tool. This rule has near-zero FP rate
# because no legitimate workflow requests many service tickets rapidly.
# FALSE POSITIVE: None for the burst pattern. Legacy environments
# with multiple RC4-only services would spread requests over time.
title: Kerberoasting Burst - Multiple RC4 TGS Requests (Automated Tool)
event_id: "4769"
description: >
  Multiple Kerberos service tickets requested with RC4 encryption
  (TicketEncryptionType 0x17/0x18) from the same source within a
  short time window. This burst pattern is the signature of automated
  Kerberoasting tools (Rubeus, Impacket GetSPNs, Invoke-Kerberoast)
  that dump all service tickets at once for offline cracking.
  Single RC4 requests may be legacy compat; bursts are always attacker tools.
  Source: SigmaHQ Kerberoasting + mdecrevoisier burst detection.
severity: critical
confidence: 0.91
technique: T1558.003
mitre: Credential Access
conditions:
  - field: TicketEncryptionType
    equals_any:
      - "0x17"
      - "23"
      - "0x18"
      - "24"
  - field: TargetUserName
    not_ends_with: "$"
    not_empty: true
    not_in:
      - krbtgt
      - ANONYMOUS LOGON
  - field: count_in_window
    greater_than: 3
    window_seconds: 60
