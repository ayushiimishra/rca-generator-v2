# SOURCE: SigmaHQ win_security_susp_privilege.yml
#         mdecrevoisier privilege escalation rules
# CONTEXT: EID 4672 fires on EVERY admin logon. The current rules fire
# on all 4672 events for named users which creates massive noise.
# This rule ONLY fires for the specific privileges attackers need:
#   SeDebugPrivilege - attach debugger to any process, dump LSASS
#   SeTcbPrivilege   - act as OS itself (highest attacker prize)
#   SeImpersonatePrivilege - token theft, Potato exploits
#   SeAssignPrimaryTokenPrivilege - replace process token
#   SeLoadDriverPrivilege - load kernel driver (rootkit)
#   SeTakeOwnershipPrivilege - take any object
# Standard admin logons get SeChangeNotifyPrivilege, SeShutdownPrivilege
# etc - those are NOT suspicious.
# FALSE POSITIVE: SeDebugPrivilege is given to Administrators by default.
# The combination with unusual hour or non-admin-workstation context
# increases confidence. Set at 0.75 as baseline.
title: Dangerous Privilege Assignment - Attacker-Relevant Privileges
event_id: "4672"
description: >
  A logon session was assigned privileges that attackers specifically need
  for credential dumping, process injection, or lateral movement.
  SeDebugPrivilege (LSASS dump), SeTcbPrivilege (OS impersonation),
  SeImpersonatePrivilege (Potato exploits), SeLoadDriverPrivilege (rootkits)
  are distinct from normal admin privileges.
  The existing rules fire on ALL admin 4672 events - this rule is precise.
  Source: SigmaHQ win_security_susp_privilege.yml + mdecrevoisier privilege rules.
severity: medium
confidence: 0.75
technique: T1134
mitre: Privilege Escalation
conditions:
  - field: PrivilegeList
    contains_any:
      - "SeDebugPrivilege"
      - "SeTcbPrivilege"
      - "SeLoadDriverPrivilege"
      - "SeAssignPrimaryTokenPrivilege"
      - "SeTakeOwnershipPrivilege"
  - field: SubjectUserName
    not_ends_with: "$"
    not_empty: true
    not_in:
      - SYSTEM
      - LOCAL SERVICE
      - NETWORK SERVICE
      - ANONYMOUS LOGON
