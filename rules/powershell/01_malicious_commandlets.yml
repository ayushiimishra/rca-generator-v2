  offensive framework (PowerSploit, Nishang, PowerView, BloodHound, Empire,
  Cobalt Strike, Rubeus, Mimikatz-PS). These are proper function names from
  red team/attack tools - they never appear in legitimate scripts.
  Requires Script Block Logging (EID 4104) to be enabled.
